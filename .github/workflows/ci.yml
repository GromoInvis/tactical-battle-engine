name: Battle Engine CI

on:
  push:
    branches: [ main ]

# Надаємо пайплайну права на запис пакетів у реєстр GitHub
permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: docker build -t tactical-engine-test .

      - name: Run pytest inside container
        run: docker run --rm tactical-engine-test pytest test_main.py

      # Крок авторизації в реєстрі пакетів GitHub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Збірка фінального образу з тегом реєстру та пуш
      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/gromoinvis/tactical-battle-engine:latest .
          docker push ghcr.io/gromoinvis/tactical-battle-engine:latest