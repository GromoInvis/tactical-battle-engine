# Назва пайплайну
name: Battle Engine CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # СТАДІЯ 1: НЕПЕРЕРВНА ІНТЕГРАЦІЯ (CI)
  # ============================================================================
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: docker build -t tactical-engine-test .

      - name: Run pytest inside container
        run: docker run --rm tactical-engine-test pytest test_main.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/gromoinvis/tactical-battle-engine:latest .
          docker push ghcr.io/gromoinvis/tactical-battle-engine:latest

  # ============================================================================
  # СТАДІЯ 2: НЕПЕРЕРВНЕ РОЗГОРТАННЯ (CD)
  # ============================================================================
  deploy:
    # Стартує тільки після успішного проходження стадії test-and-build
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Авторизація для стягування образу з реєстру
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Емуляція деплою мультиконтейнерного стеку через Docker Compose
      - name: Deploy multi-container stack via Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps