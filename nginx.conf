# ==============================================================================
# КОНФІГУРАЦІЯ ШЛЮЗУ NGINX ДЛЯ BATTLE ENGINE ТА ВЕБ-ГРИ
# ==============================================================================

events {
    # Кількість одночасних з'єднань на один робочий процес
    worker_connections 1024;
}

http {
    # Включаємо стандартні MIME-типи, щоб браузер розумів стилі та скрипти
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # 1. ГОЛОВНА СТОРІНКА: роздаємо фронтенд гри Disciples II
        # ----------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------------------
        # 2. ПРОКСЮВАННЯ API БОЙОВОГО РУШІЯ
        # ----------------------------------------------------------------------
        location /battle/ {
            proxy_pass http://api:8000/battle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Перевірка здоров'я
        location /health {
            proxy_pass http://api:8000/health;
        }

        # Метрики для Prometheus
        location /metrics {
            proxy_pass http://api:8000/metrics;
        }

        # Документація Swagger
        location /docs {
            proxy_pass http://api:8000/docs;
        }
        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
        }
    }
}