# Секція глобальних мережевих подій (обов'язковий технічний блок для Nginx)
events {}

http {
    server {
        # Порт, який слухає Nginx всередині свого контейнера (стандартний HTTP)
        listen 80;

        # Правило для всіх вхідних запитів на корінь сайту (/)
        location / {
            # proxy_pass: перенаправляє (проксує) всі запити на внутрішній контейнер api
            # Docker DNS автоматично знаходить контейнер за його ім'ям "api"
            proxy_pass http://api:8000;
            
            # Передаємо реальні заголовки оригінального клієнта всередину нашому бекенду:
            # Зберігаємо оригінальний хост (наприклад, localhost або доменне ім'я)
            proxy_set_header Host $host;
            # Передаємо справжню IP-адресу користувача, а не IP самого проксі
            proxy_set_header X-Real-IP $remote_addr;
            # Ланцюжок IP-адрес на випадок проходження через декілька проксі
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}