# Docker Compose об'єднує декілька контейнерів в одну спільну віртуальну мережу

services:
  # -------------------------------------------------------------
  # Сервіс бази даних
  # -------------------------------------------------------------
  db:
    # Офіційний образ PostgreSQL на базі надлегкого Linux Alpine (~10 МБ)
    image: postgres:15-alpine
    container_name: battle-postgres
    # Автоматичний перезапуск контейнера при помилках чи перезавантаженні системи
    restart: always
    # Змінні середовища: початкові логін, пароль та назва бази
    environment:
      POSTGRES_USER: player
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: battle_db
    # Прокидання портів: лівий (твій комп'ютер) : правий (всередині контейнера)
    ports:
      - "5432:5432"
    # Persistent Volumes: монтування папки бази даних у постійне сховище pgdata,
    # щоб дані не стиралися при зупинці чи видаленні контейнера.
    volumes:
      - pgdata:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # Сервіс бекенду (Tactical Engine API)
  # -------------------------------------------------------------
  api:
    # Вказуємо шлях до нашого Dockerfile для локальної збірки образу
    build: .
    container_name: battle-api
    restart: always
    # expose замість ports: порт 8000 відкритий ЛИШЕ для сусідніх контейнерів у цій мережі (для Nginx).
    # З твого фізичного комп'ютера напряму на http://localhost:8000 більше доступу немає (безпека).
    expose:
      - "8000"
    environment:
      # Зверни увагу: замість localhost ми пишемо ім'я сервісу "db".
      # Внутрішній DNS Docker сам перетворює "db" на потрібну IP-адресу контейнера.
      DATABASE_URL: postgresql://player:supersecretpassword@db:5432/battle_db
    # Черга старту: сервіс api почне запускатися лише після того, як створиться контейнер db
    depends_on:
      - db

  # -------------------------------------------------------------
  # Зворотний проксі-сервер (Nginx) — єдина точка входу
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: battle-nginx
    restart: always
    # Nginx приймає весь зовнішній HTTP-трафік на стандартному веб-порті 80
    ports:
      - "80:80"
    # Монтуємо наш локальний конфіг nginx.conf всередину контейнера.
    # :ro означає read-only (контейнер може лише читати конфіг, але не змінювати його)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

# Оголошення іменованого тому для бази даних
volumes:
  pgdata: