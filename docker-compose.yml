# Декларація мультиконтейнерного стеку з перевіркою працездатності (Health Check)

services:
  # ----------------------------------------------------------------------------
  # Сервіс бази даних PostgreSQL
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: battle-postgres
    restart: always
    environment:
      POSTGRES_USER: player
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: battle_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Перевірка здоров'я бази даних стандартною утилітою pg_isready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U player -d battle_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Сервіс API бойового двіжка
  # ----------------------------------------------------------------------------
  api:
    build: .
    container_name: battle-api
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://player:supersecretpassword@db:5432/battle_db
    depends_on:
      # Запускати бекенд ТІЛЬКИ тоді, коли база даних стала healthy, а не просто запустилася
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Зворотний проксі-сервер Nginx
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: battle-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro  # Монтуємо гру в Nginx
    depends_on:
      # Nginx підніметься лише тоді, коли бекенд успішно відповідає на health check
      api:
        condition: service_healthy

volumes:
  pgdata: